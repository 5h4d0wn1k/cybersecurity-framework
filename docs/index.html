<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cybersecurity Framework — the tree map of cyber tooling</title>
<meta name="description" content="An OSINT-Framework-style interactive tree map of the entire cybersecurity landscape: 27 domains, 770+ categories nested to any depth, 1000+ curated tools with effort ratings, direct links, and when-to-use guidance." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0e14'/%3E%3Cpath d='M8 2l5 2v3c0 3.2-2.1 5.7-5 7-2.9-1.3-5-3.8-5-7V4z' fill='none' stroke='%234aa8ff' stroke-width='1.3'/%3E%3Ccircle cx='8' cy='8' r='1.6' fill='%233ddc97'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0b0e14; --bg2:#10141d; --panel:#111724; --panel2:#161e2e;
    --line:#223048; --line2:#2c3b57; --txt:#dbe4f2; --muted:#8fa0bd;
    --dim:#64748e; --acc:#4aa8ff; --acc2:#3d8bff;
    --grn:#3ddc97; --grn2:#2aa16f; --warn:#ffc94d; --red:#ff6b6b;
    --off:#ff8a5c; --def:#4dd6ff; --auth:#c084fc;
    --off-bg:#1a1118; --def-bg:#0d1520;
    --node:#0f1522; --node-line:#2c3b57;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  body.light{
    --bg:#f4f6fa; --bg2:#e9edf5; --panel:#ffffff; --panel2:#f1f4fa;
    --line:#d5dced; --line2:#c3cde4; --txt:#1c2740; --muted:#51617e;
    --dim:#7a89a6; --acc:#1d7fe0; --acc2:#0f6bc4; --grn:#0f9d63;
    --grn2:#0c7a4d; --warn:#b97600; --red:#d72f2f; --off:#d95a24;
    --def:#0a7fae; --auth:#7c3aed; --node:#ffffff; --node-line:#c3cde4;
    --off-bg:#ffe9e0; --def-bg:#e6f4fb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:13.5px/1.5 var(--sans);overflow:hidden}
  pre,code,.mono{font-family:var(--mono)}
  a{color:var(--acc2)}
  header{height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line2);background:var(--bg2);position:relative;z-index:10}
  .logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .logo .prompt{color:var(--acc2);font-family:var(--mono);font-size:16px}
  .logo .name{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:-.3px}
  .logo .name span{color:var(--grn)}
  .stats{display:flex;gap:8px;margin-left:4px}
  .pill{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:2px 9px}
  .pill b{color:var(--grn);font-weight:700}
  .search{flex:1;max-width:640px;margin-left:auto;position:relative}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:8px 12px 8px 34px;font-size:13px;font-family:var(--mono);outline:none}
  .search input:focus{border-color:var(--acc2)}
  .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px}
  .search .res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;max-height:340px;overflow-y:auto;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45);z-index:40}
  .search .res.open{display:block}
  .res .row{display:flex;flex-direction:column;gap:2px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .res .row:hover{background:var(--panel2)}
  .res .row .t{font-family:var(--mono);font-weight:600;font-size:12.5px}
  .res .row .p{font-size:10.5px;color:var(--dim);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res .row .st{display:flex;gap:6px;font-size:10px;font-family:var(--mono)}
  .res .row .st .tag{border:1px solid var(--line2);border-radius:4px;padding:0 6px;color:var(--muted)}
  .res .count{font-size:9.5px;color:var(--dim);padding:6px 12px 3px;font-family:var(--mono);border-bottom:1px solid var(--line)}
  .res .empty{padding:12px;color:var(--dim);font-family:var(--mono);font-size:11.5px}
  .btn{background:var(--panel);border:1px solid var(--line2);color:var(--muted);cursor:pointer;border-radius:8px;font-family:var(--mono);font-size:11.5px;padding:6px 10px}
  .btn:hover{color:var(--txt);border-color:var(--acc2)}
  #stage{position:relative;height:calc(100% - 54px)}
  svg#tree{width:100%;height:100%;display:block}
  .link{fill:none;stroke:var(--line2);stroke-width:1.2;opacity:.7}
  .node{cursor:pointer}
  .node .bg{fill:var(--node);stroke:var(--node-line);stroke-width:1.2;transition:stroke .12s,fill .12s}
  .node:hover .bg{filter:brightness(1.18)}
  .tool:hover .bg{stroke:var(--acc2);stroke-width:1.8}
  .node.d0 .bg{fill:transparent;stroke:none}
  .node.d0 text{font-size:15px;font-weight:800;fill:var(--acc)}
  .node.d1 .bg{fill:var(--bg2);stroke-width:2}
  .node.d1.c-offense .bg{stroke:var(--off);fill:var(--off-bg)}
  .node.d1.c-defense .bg{stroke:var(--def);fill:var(--def-bg)}
  .node.d2 .bg{fill:var(--panel);stroke:var(--acc2);stroke-width:1.5}
  .node.d3 .bg{fill:var(--panel);stroke:var(--line2);stroke-width:1.4}
  .node.d3.c-offense .bg{stroke:var(--off)}
  .node.d3.c-defense .bg{stroke:var(--def)}
  .node.d4 .bg{fill:var(--node)}
  .node.d5 .bg{fill:var(--node)}
  .node text{fill:var(--txt);font:600 12.5px var(--mono);dominant-baseline:middle}
  .node.d1 text{font-size:13.5px}
  .node.d2 text{font-size:13px;fill:var(--acc)}
  .node.d3 text{fill:var(--muted)}
  .node.d4 text{fill:var(--dim);font-size:12px}
  .node.d5 text{fill:var(--dim);font-size:11.5px}
  .node .chev{fill:none;stroke:var(--dim);stroke-width:2}
  .node.d1 .chev{stroke:var(--acc2)}
  .node.d2 .chev{stroke:var(--acc2)}
  .node .cnt{fill:var(--dim);font:10px var(--mono);dominant-baseline:middle}
  .node.d1 .cnt{fill:var(--muted)}
  .node .auth{fill:var(--auth);font:bold 9px var(--mono);dominant-baseline:middle}
  .node.d1 .auth{fill:var(--auth)}
  .tool{fill:var(--txt);font:600 11.5px var(--mono);dominant-baseline:middle}
  .tool .bg{fill:none;stroke-width:1.4}
  .tool .star{fill:var(--warn)}
  .tool.best text{fill:var(--warn)}
  .tool.best .bg{stroke:var(--warn);stroke-dasharray:3 2}
  .tool.by5h4d0wn1k text{fill:var(--auth)}
  .tool.ef-easy .bg{stroke:var(--grn)}
  .tool.ef-medium .bg{stroke:var(--warn)}
  .tool.ef-advanced .bg{stroke:var(--red)}
  #hints{position:absolute;left:16px;bottom:12px;display:flex;gap:14px;color:var(--dim);font-family:var(--mono);font-size:10.5px;flex-wrap:wrap;max-width:56%;z-index:5;padding:5px 10px;background:var(--bg);border:1px solid var(--line2);border-radius:8px}
  #hints b{color:var(--muted)}
  #hints .auth-dot b{color:var(--auth)}
  #panel{position:absolute;top:14px;right:14px;bottom:14px;width:400px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.5);z-index:30;display:none;flex-direction:column;overflow:hidden}
  #panel.open{display:flex}
  #panel .ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  #panel .pt{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--acc)}
  #panel .pt .bychip{color:var(--auth);font-size:9.5px;border:1px solid var(--auth);border-radius:4px;padding:0 6px;margin-left:8px;font-weight:700}
  #panel .pt.best{color:var(--warn)}
  #panel .pclose{margin-left:auto;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  #panel .pclose:hover{color:var(--red)}
  #panel .pb{flex:1;overflow-y:auto;padding:12px 14px;font-size:12.8px}
  #panel .crumb{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:10px;line-height:1.7;word-break:break-all}
  #panel .crumb b{color:var(--acc2)}
  #panel .sec{margin:0 0 12px}
  #panel .sec .k{color:var(--dim);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--mono);margin-bottom:2px}
  #panel .sec .v{color:var(--muted);line-height:1.55}
  #panel .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  #panel .chap{border:1px solid;border-radius:5px;padding:1px 8px;font-family:var(--mono);font-size:10px}
  .chap.easy{color:var(--grn);border-color:var(--grn)}
  .chap.medium{color:var(--warn);border-color:var(--warn)}
  .chap.advanced{color:var(--red);border-color:var(--red)}
  .chap.offense{color:var(--off);border-color:var(--off)}
  .chap.defense{color:var(--def);border-color:var(--def)}
  .chap.by{color:var(--auth);border-color:var(--auth)}
  #panel .plink{display:block;text-align:center;background:var(--acc2);color:#fff;text-decoration:none;font-family:var(--mono);font-weight:700;padding:10px;border-radius:8px;margin-top:4px}
  #panel .plink.auth{background:var(--auth)}
  #panel .plink:hover{filter:brightness(1.12)}
  #footer{position:absolute;right:16px;bottom:12px;display:flex;gap:12px;font-family:var(--mono);font-size:10.5px;color:var(--dim);z-index:5}
  #footer a{color:var(--dim);text-decoration:none}
  #footer a:hover{color:var(--acc2)}
  #dnav{position:absolute;top:14px;left:16px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;z-index:5;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:6px 8px;max-width:70vw}
  #dnav .navbtn{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:6px;cursor:pointer;font-family:var(--mono);padding:1px 8px}
  #dnav button:hover:not(:disabled){color:var(--txt);border-color:var(--acc2)}
  #dnav button:disabled{opacity:.35;cursor:default}
  #dnav .cur{color:var(--acc);font-weight:700;white-space:nowrap}
  #dnav .gobtn{background:var(--panel);border:1px solid var(--line2);color:var(--acc);border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:10.5px;padding:2px 7px}
  #dnav .gobtn:hover{color:var(--txt);border-color:var(--acc2)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  @media (max-width:860px){
    .stats{display:none}
    .logo .name{font-size:13px}
    header{gap:8px;padding:0 10px}
    #panel{left:12px;right:12px;width:auto}
    #dnav{max-width:80vw}
  }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="prompt">$</span><span class="name">cybersecurity-<span>framework</span></span></div>
  <div class="stats">
    <span class="pill"><b id="st-domains">…</b> domains</span>
    <span class="pill"><b id="st-cats">…</b> categories</span>
    <span class="pill"><b id="st-tools">…</b> tools</span>
  </div>
  <div class="search">
    <span class="ic">⌕</span>
    <input id="q" type="text" placeholder="search 1000+ tools… e.g. bloodhound, hashcat, nuclei, mimikatz" autocomplete="off" spellcheck="false" />
    <div class="res" id="res"></div>
  </div>
  <button class="btn" id="expandAll">expand all</button>
  <button class="btn" id="collapseAll">collapse</button>
  <button class="btn" id="theme">light</button>
</header>

<div id="stage">
  <svg id="tree"></svg>
  <div id="dnav">
    <button class="navbtn" id="allView" title="Back to the full map of all 27 domains">◧ all</button>
    <button class="navbtn" id="prevD">◀</button>
    <span class="cur" id="dnavName">…</span>
    <button class="navbtn" id="nextD">▶</button>
  </div>
  <div id="hints">
    <span><b style="color:var(--off)">●</b> offense</span>
    <span><b style="color:var(--def)">●</b> defense</span>
    <span><b style="color:var(--warn)">★</b> best-in-class</span>
    <span><b style="color:var(--auth)">◆</b> by 5h4d0wn1k</span>
    <span><b>🖱 click</b> toggle</span>
    <span><b>🖱 dbl-click domain</b> jump</span>
    <span><b>drag</b> pan</span>
    <span><b>scroll</b> zoom</span>
  </div>
  <div id="footer">
    <a href="ETHICS.md" target="_blank">ETHICS</a>
    <a href="SCOPE.md" target="_blank">SCOPE</a>
    <a href="SCHEMA.md" target="_blank">SCHEMA</a>
    <a href="https://github.com/5h4d0wn1k/cybersecurity-framework" target="_blank">GitHub</a>
  </div>
</div>

<div id="panel">
  <div class="ph">
    <span class="pt" id="ptitle"></span>
    <button class="pclose" id="pclose">✕</button>
  </div>
  <div class="pb" id="pbody"></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const $ = s => document.querySelector(s);
  const svg = $("#tree");
  const g = document.createElementNS(NS, "g");
  svg.appendChild(g);

  let DATA, stats, rawIndex = null;

  const esc = s => (s ?? "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* ---------------- model ---------------- */
  function mkCat(c, dom, parPath) {
    const p = parPath ? parPath + "/" + c.name : c.name;
    const node = { type: "cat", label: c.name, cls: dom.cls, dom: dom.name, path: p,
      collapsed: true, children: [], domIdx: dom._i };
    for (const sub of (c.subcategories || [])) node.children.push(mkCat(sub, dom, p));
    for (const t of (c.tools || [])) {
      node.children.push({ type: "tool", label: t.name, cls: dom.cls, dom: dom.name,
        effort: t.effort || "easy", rating: t.rating || 3, best: !!t.best,
        desc: t.desc || "", when: t.when || "", install: t.install || "",
        alt: t.alt || [], url: t.url || "", by: t.by || "", path: p + "/" + t.name });
    }
    return node;
  }
  function mkDomain(dom, collapsed) {
    const root = { type: "domain", label: (dom.emoji ? dom.emoji + " " : "") + dom.name,
      cls: dom.cls, dom: dom.name, domIdx: DATA ? DATA.findIndex(d => d.id === dom.id) : -1, path: dom.name,
      collapsed: !!collapsed, children: [] };
    for (const c of dom.categories) root.children.push(mkCat(c, dom, dom.name));
    return root;
  }
  function mkGroup(g, pillar) {
    return { type: "group", label: g.name, cls: pillar.cls, pillar: pillar.id,
      path: pillar.id + "/" + g.id, collapsed: true,
      children: g.domains.map(d => mkDomain(d, true)) };
  }
  function mkPillar(p) {
    return { type: "pillar", label: (p.emoji ? p.emoji + " " : "") + p.name,
      cls: p.cls, path: p.id, tagline: p.tagline || "", collapsed: false,
      children: (p.groups || []).map(g => mkGroup(g, p)) };
  }
  function setDepth(root) {
    const rank = { all: 0, pillar: 1, group: 2, domain: 3 };
    root.dv = 0;
    (function walk(n, pd) {
      for (const c of (n.children || [])) {
        let d = rank[c.type];
        if (d === undefined) d = pd + 1;   // categories & deeper
        c.dv = Math.min(d, 5);
        walk(c, d);
      }
    })(root, 0);
    return root;
  }

  let PILLS = [];
  let allRoot = null;
  let curRoot = null;
  let mode = "single";     // "single" | "all"
  let di = 0;
  const LV = 30, VL = 28, WDOM = 220, WGRP = 300, WOTH = 170;

  function nodeWidth(n) {
    const l = (n.label || "").length;
    const w = n.type === "all"    ? Math.max(520, l * 9.6 + 120)
           : n.type === "pillar"  ? Math.max(WDOM + 60, l * 9.6 + 90)
           : n.type === "group"   ? Math.max(WGRP, l * 8.8 + 70)
           : n.type === "domain"  ? Math.max(WDOM, l * 8.8 + 64)
           : n.type === "cat"     ? Math.max(WOTH, l * 8.4 + 60)
           : Math.max(150, l * 8.2 + (n.by ? 60 : 40));
    return w;
  }

  /* ---------------- layout ---------------- */
  function layoutRoot(root) {
    const nodes = [], links = [];
    let cursor = 0;
    (function depth(n, d) { n.d = d; for (const c of (n.children || [])) depth(c, d + 1); })(root, 0);

    (function assign(n, parentOpen) {
      const kids = n.children || [];
      const open = parentOpen && n.type !== "tool" && !n.collapsed;
      n.slot = cursor;
      nodes.push(n);
      cursor++;
      n.open = open;
      if (open) {
        for (const c of kids) {
          links.push({ s: n, t: c });
          assign(c, true);
        }
      }
    })(root, true);

    for (const n of nodes) { n.x = n.d * LV; n.y = n.slot * VL; }
    return { nodes, links };
  }

  /* ---------------- render ---------------- */
  let transform = { x: 24, y: 60, k: 1 };

  function chevPath(open) { return open ? "M 3 -4 L -2 0 L 3 4" : "M -3 -4 L 3 0 L -3 4"; }

  function build() {
    g.innerHTML = "";
    const { nodes, links } = layoutRoot(curRoot);
    for (const l of links) {
      const el = document.createElementNS(NS, "path");
      const mx = (l.s.x + l.t.x) / 2;
      el.setAttribute("d", `M ${l.s.x} ${l.s.y} C ${mx} ${l.s.y}, ${mx} ${l.t.y}, ${l.t.x} ${l.t.y}`);
      el.setAttribute("class", "link");
      g.appendChild(el);
    }
    for (const n of nodes) {
      const el = document.createElementNS(NS, "g");
      if (n.type === "tool") {
        el.setAttribute("class", "node tool ef-" + n.effort + (n.best ? " best" : "") + (n.by ? " by" + n.by : ""));
        const w = nodeWidth(n);
        innerHTML(el, `
          <rect class="bg" x="-6" y="-11" width="${w}" height="22" rx="11"/>
          <text x="${n.best ? 10 : 6}" y="0">${n.best ? "★ " : ""}${esc(n.label)}</text>
          ${n.by ? `<rect class="authbg" x="${w - 24}" y="-9" width="18" height="12" rx="4" fill="var(--auth)" opacity="0.18"/><text class="auth" x="${w - 15}" y="0" text-anchor="middle" style="fill:var(--auth)">by</text>` : ""}`);
        bind(el, n);
      } else {
        const kidsT = (n.children || []).filter(k => k.type === "tool").length;
        const kidsC = (n.children || []).filter(k => k.type !== "tool").length;
        el.setAttribute("class", "node d" + n.dv + " t" + n.type + " c-" + n.cls);
        const w = nodeWidth(n);
        const lx = n.type === "pillar" ? 26 : n.type === "group" ? 22 : n.type === "domain" ? 20 : 12;
        const tpl = n.type === "all"
          ? (`
            <text x="-6" y="1">◎ ${esc(n.label)}</text>
            <text class="cnt" x="${w - 10}" y="1" text-anchor="end">${stats ? stats.domains + " domains · " + stats.tools + " tools · " + stats.categories + " categories" : ""}</text>`)
          : n.type === "pillar"
          ? (`
            <rect class="bg" x="-14" y="-17" width="${w}" height="34" rx="11"/>
            <path class="chev" d="${chevPath(n.open)}"/>
            <text x="${lx}" y="1">${esc(n.label)}</text>
            <text class="cnt" x="${w - 10}" y="1" text-anchor="end">${childrenTools(n)} tools</text>
            <title>${esc(n.label)} — ${childrenTools(n)} tools. Click to expand/collapse.</title>`)
          : n.type === "group"
          ? (`
            <rect class="bg" x="-12" y="-15" width="${w}" height="30" rx="10"/>
            <path class="chev" d="${chevPath(n.open)}"/>
            <text x="${lx}" y="1">${esc(n.label)}</text>
            <text class="cnt" x="${w - 8}" y="1" text-anchor="end">${childrenTools(n)} tools</text>
            <title>${esc(n.label)} — ${childrenTools(n)} tools in ${n.children.length} domain(s).</title>`)
          : (`
            <rect class="bg" x="-10" y="-13" width="${w}" height="26" rx="8"/>
            <path class="chev" d="${chevPath(n.open)}"/>
            <text x="${lx}" y="1">${esc(n.label)}</text>
            <text class="cnt" x="${w - 8}" y="1" text-anchor="end">${kidsT ? kidsT + " 🛠" : ""}${kidsC ? (kidsT ? " " : "") + kidsC + " ▸" : ""}</text>
            <title>${esc(n.label)} — ${kidsT ? kidsT + " tools, " : ""}${kidsC ? kidsC + " subcategories" : "empty"}. Click to toggle.</title>`);
        innerHTML(el, tpl);
        bind(el, n);
      }
      el.setAttribute("transform", `translate(${n.x} ${n.y})`);
      g.appendChild(el);
    }

    if (!g.__fitted) {
      fitBox(nodes);
      g.__fitted = 1;
      apply();
    } else {
      // keep user's pan/zoom only if everything is still on screen; else re-fit
      const maxY = nodes.reduce((m, n) => Math.max(m, n.y), 0) * transform.k + transform.y;
      const maxX = nodes.reduce((m, n) => Math.max(m, n.x + nodeWidth(n)), 0) * transform.k + transform.x;
      const vw = svg.clientWidth || 1200, vh = svg.clientHeight || 800;
      if (maxY > vh + 10 || maxX > vw + 10 || transform.y > -5) {
        fitBox(nodes);
        apply();
      }
    }
  }

  function fitBox(nodes) {
    const bw = Math.max(...nodes.map(n => n.x + nodeWidth(n)));
    const bh = nodes.reduce((m, n) => Math.max(m, n.y), 0) + VL * 2;
    const vw = svg.clientWidth || 1200, vh = svg.clientHeight || 800;
    let k = Math.min(vw / bw, vh / bh);
    transform = { x: 36, y: 92, k: Math.max(0.5, Math.min(k, 1.15)) };
  }

  function innerHTML(el, html) { el.innerHTML = html; }

  function childrenTools(n) {
    let c = 0;
    (function w(x) { for (const k of (x.children || [])) { if (k.type === "tool") c++; else w(k); } })(n);
    return c ? c + " 🛠" : "";
  }

  function bind(el, n) {
    if (n.type === "tool") {
      el.addEventListener("click", () => openPanel(n));
      el.addEventListener("dblclick", e => { e.stopPropagation(); if (n.url) window.open(n.url, "_blank"); });
    } else if (n.type === "all") {
      el.style.cursor = "default";
    } else if (n.type === "domain") {
      if (n === curRoot) {
        el.style.cursor = "default";
      } else {
        el.addEventListener("click", () => { n.collapsed = !n.collapsed; build(); });
        el.addEventListener("dblclick", e => { e.stopPropagation(); pick(n.domIdx); });
      }
    } else {
      el.addEventListener("click", () => { n.collapsed = !n.collapsed; build(); });
    }
  }

  function apply() { g.setAttribute("transform", `translate(${transform.x} ${transform.y}) scale(${transform.k})`); }

  /* ---------------- views ---------------- */
  function pick(i) {
    mode = "single";
    di = (i + DATA.length) % DATA.length;
    curRoot = mkDomain(DATA[di]);
    setDepth(curRoot);
    g.__fitted = 0;
    transform = { x: 24, y: 60, k: 1 };
    $("#dnavName").textContent = DATA[di].emoji + " " + DATA[di].name;
    build();
  }
  function pickAll() {
    mode = "all";
    curRoot = setDepth(allRoot);
    g.__fitted = 0;
    transform = { x: 24, y: 60, k: 1 };
    $("#dnavName").textContent = "all " + stats.domains + " domains — " + stats.tools + " tools";
    build();
  }

  $("#allView").addEventListener("click", pickAll);
  $("#prevD").addEventListener("click", () => pick(di - 1));
  $("#nextD").addEventListener("click", () => pick(di + 1));

  /* ---------------- pan / zoom / keyboard ---------------- */
  let dragging = false, sx = 0, sy = 0;
  svg.addEventListener("mousedown", e => { if (e.target.closest(".node")) return; dragging = true; sx = e.clientX - transform.x; sy = e.clientY - transform.y; });
  window.addEventListener("mousemove", e => { if (!dragging) return; transform.x = e.clientX - sx; transform.y = e.clientY - sy; apply(); });
  window.addEventListener("mouseup", () => dragging = false);
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const f = e.deltaY < 0 ? 1.12 : 0.89;
    const k2 = Math.max(0.12, Math.min(3, transform.k * f));
    const wx = (mx - transform.x) / transform.k, wy = (my - transform.y) / transform.k;
    transform.k = k2;
    transform.x = mx - wx * k2;
    transform.y = my - wy * k2;
    apply();
  }, { passive: false });
  document.addEventListener("keydown", e => {
    if (e.target.id === "q") return;
    if (e.key === "Escape") panel.classList.remove("open");
  });

  /* ---------------- search ---------------- */
  const q = $("#q"), res = $("#res");
  let tools = [];
  function buildIndex() {
    tools = [];
    rawIndex = {};
    for (const dom of DATA) {
      const root = mkDomain(dom, false);
      (function each(n) {
        if (n.type === "tool") { tools.push(n); rawIndex[n.path] = n; }
        for (const c of (n.children || [])) each(c);
      })(root);
    }
  }

  function doSearch(s) {
    s = (s || "").trim().toLowerCase();
    if (!s) { res.classList.remove("open"); res.innerHTML = ""; return; }
    const hits = tools.filter(t => t.label.toLowerCase().includes(s) || t.path.toLowerCase().includes(s)).slice(0, 40);
    const html = hits.slice(0, 25).map((t, i) => `<div class="row" data-dom="${esc(t.dom)}" data-path="${esc(t.path)}">
      <span class="t">${t.best ? "★ " : ""}${t.by ? "◆ " : ""}${esc(t.label)}</span>
      <span class="p">${esc(t.path)}</span>
      <span class="st"><span class="tag" style="color:var(--${effColor(t.effort)})">${esc(t.effort)}</span><span class="tag">${t.rating}/5</span><span class="tag">${esc(t.cls)}</span></span>
    </div>`).join("");
    res.innerHTML =
      `<div class="count">${hits.length} of ${tools.length} tools indexed</div>` +
      (html || `<div class="empty">no matches for “${esc(s)}”</div>`);
    res.__hits = hits;
    res.classList.add("open");
  }
  function effColor(e) { return e === "easy" ? "grn" : e === "advanced" ? "red" : "warn"; }

  q.addEventListener("input", () => doSearch(q.value));
  res.addEventListener("click", e => {
    const row = e.target.closest(".row");
    if (!row || !res.__hits) return;
    const domK = row.dataset.dom;
    const path = row.dataset.path;
    const dIdx = DATA.findIndex(d => d.name === domK || d.id === domK);
    if (dIdx < 0) return;
    pick(dIdx);                       // switch to that domain
    const segs = path.split("/");
    let node = curRoot;
    for (let i = 1; i < segs.length - 1; i++) {   // skip domain root + tool segment
      const nxt = (node.children || []).find(c => c.type === "cat" && c.label === segs[i]);
      if (!nxt) break;
      nxt.collapsed = false;
      node = nxt;
    }
    build();
    const { nodes } = layoutRoot(curRoot);
    const target = nodes.find(n => n.path === path);
    if (target) {
      transform.k = Math.max(transform.k, 0.85);
      transform.x = (svg.clientWidth / 2) - target.x * transform.k - nodeWidth(target) / 2 * transform.k;
      transform.y = (svg.clientHeight / 2) - target.y * transform.k;
      apply();
      const win = (node.children || []).find(c => c.path === path);
      openPanel(win || findTool(path));
    }
    res.classList.remove("open");
  });
  function findTool(path) {
    for (const t of tools) if (t.path === path) return t;
    return null;
  }
  document.addEventListener("click", e => { if (!e.target.closest(".search")) res.classList.remove("open"); });

  /* ---------------- panel ---------------- */
  const panel = $("#panel");
  function openPanel(t) {
    if (!t) return;
    const pt = $("#ptitle");
    pt.innerHTML = (t.best ? "★ " : "") + esc(t.label) + (t.by ? `<span class="bychip">by ${esc(t.by)}</span>` : "");
    pt.className = "pt" + (t.best ? " best" : "");
    $("#pbody").innerHTML = `
      <div class="crumb">${esc(t.path.split("/").map((p, i) => i === 0 ? `<b>${esc(p)}</b>` : esc(p)).join(" <span style='color:var(--line2)'>&#47;</span> "))}</div>
      <div class="badges">
        <span class="chap ${esc(t.effort)}">${esc(t.effort)}</span>
        <span class="chap ${esc(t.cls)}">${esc(t.cls)}</span>
        <span class="chap" style="border-color:var(--line2);color:var(--muted)">${t.rating}/5</span>
        ${t.best ? '<span class="chap" style="border-color:var(--warn);color:var(--warn)">★ best-in-class</span>' : ""}
        ${t.by ? `<span class="chap by">◆ by ${esc(t.by)}</span>` : ""}
      </div>
      <div class="sec"><div class="k">What it does</div><div class="v">${esc(t.desc) || "—"}</div></div>
      <div class="sec"><div class="k">When to use it</div><div class="v">${esc(t.when) || "—"}</div></div>
      <div class="sec"><div class="k">Install</div><div class="v" style="font-family:var(--mono);font-size:11.5px">${esc(t.install) || "—"}</div></div>
      <div class="sec"><div class="k">Alternatives</div><div class="v">${esc((t.alt || []).join(" · ")) || "—"}</div></div>
      ${t.url ? `<a class="plink${t.by ? " auth" : ""}" href="${esc(t.url)}" target="_blank" rel="noopener">${t.by ? "open on GitHub ↗" : "open tool ↗"}</a>` : ""}`;
    panel.classList.add("open");
  }
  $("#pclose").addEventListener("click", () => panel.classList.remove("open"));
  document.addEventListener("mousedown", e => {
    if (panel.classList.contains("open") && !panel.contains(e.target) && !e.target.closest(".node")) {
      panel.classList.remove("open");
      res.classList.remove("open");
    }
  });

  /* ---------------- expand / collapse ---------------- */
  $("#expandAll").addEventListener("click", () => {
    (function e(n) { for (const c of (n.children || [])) { if (c.type === "tool") continue; c.collapsed = false; e(c); } })(curRoot);
    build();
  });
  $("#collapseAll").addEventListener("click", () => {
    (function c(n) {
      for (const ch of (n.children || [])) {
        if (ch.type === "tool") continue;
        if (ch.type !== "pillar") ch.collapsed = true;
        c(ch);
      }
    })(curRoot);
    build();
  });

  /* ---------------- theme ---------------- */
  const themeBtn = $("#theme");
  themeBtn.addEventListener("click", () => {
    const b = document.body; b.classList.toggle("light");
    themeBtn.textContent = b.classList.contains("light") ? "dark" : "light";
    localStorage.setItem("theme", b.classList.contains("light") ? "light" : "dark");
  });
  if (localStorage.getItem("theme") === "light") { document.body.classList.add("light"); themeBtn.textContent = "dark"; }

  /* ---------------- boot ---------------- */
  (async function () {
    let data;
    try { data = await (await fetch("data/tree.json")).json(); }
    catch (e) {
      document.body.innerHTML = '<div style="padding:40px;font-family:monospace">Could not load data/tree.json — run <b>python3 scripts/build.py</b></div>';
      return;
    }
    DATA = data.domains;
    stats = data.stats;
    PILLS = data.pillars || [];
    DATA.forEach((dom, i) => dom._i = i);
    $("#st-domains").textContent = stats.domains;
    $("#st-cats").textContent = stats.categories;
    $("#st-tools").textContent = stats.tools;
    buildIndex();
    allRoot = { type: "all", label: "all " + stats.domains + " domains", cls: "defense", dom: "all", path: "all",
      collapsed: false, children: PILLS.map(mkPillar) };
    pickAll();
  })();
})();
</script>
</body>
</html>
