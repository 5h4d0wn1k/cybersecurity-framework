name: build-and-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build merged tree data + md mirrors
        run: python3 scripts/build.py
      - name: Commit rebuilt data
        run: |
          git config user.name "5h4d0wn1k"
          git config user.email "5h4d0wn1k@users.noreply.github.com"
          git add docs/data/tree.json tree/
          git diff --cached --quiet || git commit -m "build: regenerate docs/data/tree.json + md mirrors"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy Pages
        uses: actions/deploy-pages@v4